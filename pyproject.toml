[project]
name = "pricelens"
version = "0.1.0"
description = "PriceLens — Airbnb listing price intelligence: defensible price bands, drivers, and comparables."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "catboost>=1.2",
  "optuna>=3.6",
  "mlflow>=2.12",
  "shap>=0.45",
  "numba>=0.59",
  "llvmlite>=0.42",
  "sentence-transformers>=2.7",
  "langdetect>=1.0.9",
  "geopandas>=0.14",
  "shapely>=2.0",
  "h3>=3.7,<4",
  "hydra-core>=1.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "streamlit>=1.35",
  "pydeck>=0.9",
  "requests>=2.31",
  "tqdm>=4.66",
  "joblib>=1.4",
]

[project.scripts]
pricelens = "pricelens.cli:app"

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "pre-commit>=3.7",
  "nbstripout>=0.7",
  "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricelens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PD", "NPY"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
]
