name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -m "not slow"

  attribution-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Reject AI attribution in commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG=$(git log --format='%an%n%ae%n%B' "${{ github.event.pull_request.base.sha }}..${{ github.sha }}")
          else
            LOG=$(git log -1 --format='%an%n%ae%n%B' "${{ github.sha }}")
          fi
          if echo "$LOG" | grep -iE '(co-authored-by|generated with|claude|anthropic|noreply@anthropic)'; then
            echo "::error::AI attribution found in commit history"; exit 1
          fi
